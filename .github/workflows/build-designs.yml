name: Build designs (manual)

# Build any design declaring a designs/**/design.json manifest.
on:
  workflow_dispatch:
    inputs:
      design:
        description: 'Project ID under designs/, or all'
        required: true
        type: string
        default: 'all'

permissions:
  contents: read

concurrency:
  group: build-designs-${{ github.ref }}-${{ inputs.design }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate selected CAD designs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository and Git LFS geometry
        uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false

      - name: Install uv and enable dependency cache
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.10.0'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install pinned Python
        run: uv python install

      - name: Check lockfile or bootstrap first lock
        id: lockfile
        shell: bash
        run: |
          if [ -f uv.lock ]; then
            uv lock --check
            echo 'generated=false' >> "$GITHUB_OUTPUT"
          else
            uv lock
            echo 'generated=true' >> "$GITHUB_OUTPUT"
            echo '::warning::uv.lock is not committed. Download the generated-uv-lock artifact and commit uv.lock for reproducible builds.'
          fi

      - name: Offer generated lockfile as an artifact
        if: steps.lockfile.outputs.generated == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: generated-uv-lock
          path: uv.lock
          if-no-files-found: error
          retention-days: 14

      - name: Install mesh validator dependencies
        run: uv sync --locked --no-default-groups --group ci

      - name: Verify design manifests
        run: uv run --no-sync python scripts/build_designs.py --check

      - name: Rebuild and validate selected designs
        env:
          BUILD_SELECTION: ${{ inputs.design }}
        run: uv run --no-sync python scripts/build_designs.py --design "$BUILD_SELECTION" --artifact-root dist/builds

      - name: Add design build report to Actions summary
        if: always()
        shell: bash
        run: |
          if [ -f dist/builds/BUILD-REPORT.md ]; then
            cat dist/builds/BUILD-REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No build report was created.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload rebuilt STL files and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rebuilt-designs-${{ github.run_id }}
          path: dist/builds/
          if-no-files-found: warn
          retention-days: 14
