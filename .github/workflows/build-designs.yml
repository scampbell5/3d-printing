name: Build designs (manual)

# Rebuild any project that includes a designs/**/design.json manifest.
# Use design=all to regenerate every registered project, or enter a slug
# like gridfinity/reciprocating-saw-blade-holder to regenerate one.
on:
  workflow_dispatch:
    inputs:
      design:
        description: 'Project ID under designs/, or all'
        required: true
        type: string
        default: 'all'

permissions:
  contents: read

concurrency:
  group: build-designs-${{ github.ref }}-${{ inputs.design }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate selected CAD designs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source and Git LFS geometry
        uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt

      - name: Install mesh validator dependencies
        run: python -m pip install -r scripts/requirements-ci.txt

      - name: Verify all design manifests
        run: python scripts/build_designs.py --check

      - name: Rebuild and validate selected designs
        env:
          BUILD_SELECTION: ${{ inputs.design }}
        run: python scripts/build_designs.py --design "$BUILD_SELECTION" --artifact-root dist/builds

      - name: Add design build report to Actions summary
        if: always()
        shell: bash
        run: |
          if [ -f dist/builds/BUILD-REPORT.md ]; then
            cat dist/builds/BUILD-REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No build report was created.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload rebuilt STL files and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rebuilt-designs-${{ github.run_id }}
          path: dist/builds/
          if-no-files-found: warn
          retention-days: 14
